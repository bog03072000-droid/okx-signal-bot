[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# Глобально встановлений (не з requirements.txt цього проєкту) пакет web3
# реєструє зламаний pytest-плагін entry point "pytest_ethereum"
# (ImportError: ContractName з eth_typing, версійний конфлікт у web3 самого
# по собі, ніяк не пов'язаний з okx-signal-bot) — без цього рядка pytest
# взагалі не стартує на машинах, де стоїть цей пакет.
addopts = -p no:pytest_ethereum
